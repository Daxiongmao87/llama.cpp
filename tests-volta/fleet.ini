# TEST fleet config: 1x 27B NVFP4 TP2 main @128K + 3x 4B subagents
# (1 long @128K, 2 std @32K). CUDA2/A2000 NOT used.

[main-27b-nvfp4]
model = /mnt/hdd/ai/models/llm/qwen3.8-27b-nvfp4-hf/Qwen3.8-27B-NVFP4.gguf
alias = qwen3.8-27b-nvfp4
device = CUDA0,CUDA1
split-mode = tensor
c = 131072
np = 1
fit = off
batch-size = 2048
ubatch-size = 2048
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
no-kv-unified = true
spec-type = draft-mtp
spec-draft-n-max = 7
spec-draft-p-min = 0.60
jinja = true
reasoning = auto
load-on-startup = true
stop-timeout = 30

[qwen4b-long]
model = /mnt/hdd/ai/models/llm/qwen3.5-4b-nvfp4/qwen3.5-4b-nvfp4.gguf
